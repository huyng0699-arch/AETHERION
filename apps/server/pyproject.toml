[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherion-server"
version = "0.2.0"
description = "AETHERION local-first HTTP health data foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
aetherion-server = "aetherion_server.main:run"
aetherion-bootstrap = "aetherion_server.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
