[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherion-server"
version = "0.1.0"
description = "AETHERION local-first HTTP health data foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
