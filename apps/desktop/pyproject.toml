[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherion-desktop"
version = "0.1.0"
description = "Native AETHERION desktop application shell"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7.0"]

[project.scripts]
aetherion-desktop = "aetherion_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]
