[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherion-desktop"
version = "0.1.0"
description = "Native AETHERION desktop application shell"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7.0"]

[project.optional-dependencies]
atlas = ["pyvista>=0.45,<1.0", "pyvistaqt>=0.13,<1.0"]

[project.scripts]
aetherion-desktop = "aetherion_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aetherion_desktop" = ["i18n/*.json"]
"aetherion_desktop.features.demo" = ["ma7_source.json"]
