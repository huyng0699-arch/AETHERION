name: Python server tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server
        run: python -m pip install -e ./apps/server
      - name: Compile Python modules
        run: python -m compileall -q apps/server/src apps/desktop/src
      - name: Run SQLite tests
        run: python -m unittest discover -s tests -v
