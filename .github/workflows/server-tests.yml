name: Python server tests

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "tests/test_server_*.py"
      - "tests/test_contract_*.py"
      - "tests/test_core_*.py"
      - "tests/test_api_*.py"
      - "tests/test_encyclopedia_*.py"
      - "tests/test_guide_*.py"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "tests/test_server_*.py"
      - "tests/test_contract_*.py"
      - "tests/test_core_*.py"
      - "tests/test_api_*.py"
      - "tests/test_encyclopedia_*.py"
      - "tests/test_guide_*.py"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server and pytest
        run: python -m pip install pytest -e ./apps/server
      - name: Compile Python modules
        run: python -m compileall -q apps/server/src apps/desktop/src
      - name: Run focused server and contract tests
        run: python -m pytest -q tests/test_server_*.py tests/test_contract_*.py tests/test_core_*.py tests/test_api_*.py
