name: Expo demo visual verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/server/**'
      - 'knowledge/nasa/**'
      - 'scripts/run_mobile_local.py'
      - 'scripts/capture_expo_demo.mjs'
      - '.github/workflows/expo-demo-preview.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and Expo dependencies
        run: |
          python -m pip install -e apps/server
          npm ci --prefix apps/mobile --no-audit --no-fund
          npm install --prefix apps/mobile --no-save --package-lock=false playwright@1.56.1
          cd apps/mobile && npx playwright install --with-deps chromium
      - name: Export the Expo web application
        run: npm run export:web --prefix apps/mobile
      - name: Start isolated verification server
        run: |
          python scripts/run_mobile_local.py --verification > "$RUNNER_TEMP/aetherion-server.log" 2>&1 &
          for n in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8769/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aetherion-server.log"
          exit 1
      - name: Capture and verify phone and desktop
        env:
          AETHERION_BASE_URL: http://127.0.0.1:8769
          AETHERION_SCREENSHOT_DIR: ${{ runner.temp }}/aetherion-mobile-demo
        run: node scripts/capture_expo_demo.mjs
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-demo-screenshots
          path: |
            ${{ runner.temp }}/aetherion-mobile-demo/
            ${{ runner.temp }}/aetherion-server.log
          if-no-files-found: warn
