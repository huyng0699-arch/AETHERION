name: Build Android demo APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-demo-apk.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: aetherion-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile dependencies and required Expo Babel preset
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev babel-preset-expo@54.0.12 --no-audit --no-fund

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Verify, name and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist-apk
          cp "$APK" dist-apk/AETHERION-Android-Demo-v0.1.0.apk
          (cd dist-apk && sha256sum AETHERION-Android-Demo-v0.1.0.apk > SHA256SUMS.txt)

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHERION-Android-Demo-v0.1.0
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-android-${{ github.run_number }}
          name: AETHERION Android Demo v0.1.0
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: dist-apk/*
          body: |
            Installable AETHERION Android demo by Team TRUY TINH for the NASA Space Apps Challenge 2026.

            - Package: `io.truytinh.aetherion.mobile`
            - Android SDK: 36
            - APK alignment and APK Signature Scheme verification run before publication
            - SHA-256 checksum included in `SHA256SUMS.txt`
            - Offline NASA MA-7 historical archive included
            - Connected health records, administration and AI use the AETHERION Server

      - name: Report Android release result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE="${{ job.status }}"
          DESCRIPTION="Android release workflow completed"
          if [ "$STATE" != "success" ]; then
            STATE="failure"
            DESCRIPTION="Android release workflow needs attention"
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"aetherion/android-release\",\"description\":\"$DESCRIPTION\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
