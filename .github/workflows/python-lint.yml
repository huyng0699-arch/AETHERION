name: Python syntax and lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python syntax and indentation lint
        run: python scripts/lint_python.py
      - name: Run lint unit tests
        run: python -m unittest tests/test_lint_python.py -v
