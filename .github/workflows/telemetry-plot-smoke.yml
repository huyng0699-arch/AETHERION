name: Q-0486 telemetry plot offscreen smoke

on:
  pull_request:
    paths:
      - "apps/desktop/src/aetherion_desktop/telemetry_plot.py"
      - "scripts/smoke_telemetry_plot.py"
      - "quests/v1/Q-0486.md"
      - ".github/workflows/telemetry-plot-smoke.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/src/aetherion_desktop/telemetry_plot.py"
      - "scripts/smoke_telemetry_plot.py"
      - "quests/v1/Q-0486.md"
      - ".github/workflows/telemetry-plot-smoke.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the declared desktop runtime
        run: python -m pip install "PySide6>=6.7,<7.0"
      - name: Run focused interaction and render smoke
        run: python scripts/smoke_telemetry_plot.py --output artifacts/q0486-telemetry-plot.png
      - name: Upload the rendered component preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q0486-telemetry-plot-preview
          path: artifacts/q0486-telemetry-plot.png
          if-no-files-found: warn
          retention-days: 14
